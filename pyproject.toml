[project]
name = "inleverboks"
version = "0.1.2"
description = "Digitaal examenwerk inleveren voor het mbo"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.7",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "segno==1.6.6",
    "pillow==13.0.0",
    "weasyprint==70.0",
    "zipstream-ng==1.9.3",
    "typer==0.29.1",
    "itsdangerous==2.2.0",
    "cryptography==50.0.2",
    "psycopg[binary]==3.3.9",
    "boto3==1.44.2",
    "apscheduler==3.11.3",
    "structlog==26.1.0",
    "babel==2.18.0",
    "charset-normalizer==3.5.2",
]

[project.scripts]
inleverboks = "inleverboks.cli:app"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx2==2.16.0",
    "playwright==1.65.1",
    "pytest-playwright==0.10.0",
    "moto[s3]==5.2.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inleverboks"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "DTZ", "N", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"
packages = ["inleverboks", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["segno.*", "weasyprint.*", "zipstream.*", "pyotp.*", "boto3.*", "botocore.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: end-to-end tests with Playwright (run with -m e2e)"]

[tool.coverage.run]
source = ["inleverboks"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
