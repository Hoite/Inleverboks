# Override for testing the scale-out setup locally: PostgreSQL + S3 (MinIO).
#   docker compose -f compose.yaml -f compose.scale.yaml up --build
#
# MinIO no longer publishes community images on Docker Hub; this uses the Chainguard
# build of MinIO, pinned by digest. The app creates the bucket on startup if missing.
services:
  app:
    environment:
      DATABASE_URL: postgresql://inleverboks:inleverboks@postgres:5432/inleverboks
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: inleverboks
      S3_REGION: us-east-1
      S3_ACCESS_KEY: inleverboks
      S3_SECRET_KEY: inleverboks-dev-only
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_USER: inleverboks
      POSTGRES_PASSWORD: inleverboks
      POSTGRES_DB: inleverboks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inleverboks"]
      interval: 2s
      retries: 30

  minio:
    image: chainguard/minio@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: inleverboks
      MINIO_ROOT_PASSWORD: inleverboks-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
  miniodata:
