apiVersion: apps/v1
kind: Deployment
metadata:
  name: inleverboks
spec:
  # SQLite on a ReadWriteOnce volume: exactly one pod, and the old pod stops before
  # the new one starts. For more replicas see "Opschalen" in the README.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Room to finish running uploads and zip downloads.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/hoite/inleverboks
          command: ["inleverboks", "migrate"]
          envFrom:
            - configMapRef:
                name: inleverboks-config
            - secretRef:
                name: inleverboks-secret
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: ghcr.io/hoite/inleverboks
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inleverboks-config
            - secretRef:
                name: inleverboks-secret
          securityContext: *container-security
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # WeasyPrint (PDF) needs memory.
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inleverboks-data
        # Uploads are streamed to temporary files here before they are stored.
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
